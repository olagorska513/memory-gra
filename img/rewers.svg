<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rewers karty w stylu wycinanki z papieru. Kolorowy gradient pod spodem
       i znak „?” na środku dokłada CSS (.card-back), tu są tylko warstwy papieru. -->
  <defs>
    <filter id="faktura" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="cien" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- faktura papieru -->
  <rect width="100" height="100" filter="url(#faktura)" opacity="0.16" style="mix-blend-mode: soft-light"/>

  <!-- warstwa 1: jaśniejszy, wycięty panel -->
  <rect x="7" y="7" width="86" height="86" rx="9" fill="#ffffff" fill-opacity="0.14" filter="url(#cien)"/>

  <!-- kropki w rogach -->
  <g fill="#ffffff" fill-opacity="0.6">
    <circle cx="16" cy="16" r="2.4"/>
    <circle cx="84" cy="16" r="2.4"/>
    <circle cx="16" cy="84" r="2.4"/>
    <circle cx="84" cy="84" r="2.4"/>
  </g>

  <!-- warstwa 2: rozeta z ośmiu płatków (lawenda i róż na zmianę) -->
  <g filter="url(#cien)">
    <circle cx="50" cy="50" r="19" fill="#e0e7ff"/>
    <circle cx="67" cy="50" r="10" fill="#e0e7ff"/>
    <circle cx="62.02" cy="62.02" r="10" fill="#fce7f3"/>
    <circle cx="50" cy="67" r="10" fill="#e0e7ff"/>
    <circle cx="37.98" cy="62.02" r="10" fill="#fce7f3"/>
    <circle cx="33" cy="50" r="10" fill="#e0e7ff"/>
    <circle cx="37.98" cy="37.98" r="10" fill="#fce7f3"/>
    <circle cx="50" cy="33" r="10" fill="#e0e7ff"/>
    <circle cx="62.02" cy="37.98" r="10" fill="#fce7f3"/>
  </g>

  <!-- warstwa 3: biały środek pod znakiem zapytania -->
  <circle cx="50" cy="50" r="16.5" fill="#ffffff" filter="url(#cien)"/>
</svg>
