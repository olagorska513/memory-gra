<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ikona gry: dwie papierowe karty – rewers i kot z tła gry -->
  <defs>
    <linearGradient id="rewers" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="cien" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.3" flood-color="#312e81" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect id="tlo" width="64" height="64" rx="14" fill="#e0e7ff"/>

  <!-- karta z tyłu: rewers z rozetą -->
  <g transform="rotate(-12 32 32)" filter="url(#cien)">
    <rect x="9" y="11" width="28" height="38" rx="5" fill="url(#rewers)"/>
    <circle cx="23" cy="30" r="7" fill="#fce7f3"/>
    <circle cx="23" cy="30" r="4.5" fill="#ffffff"/>
  </g>

  <!-- karta z przodu: kot -->
  <g transform="rotate(10 32 32)" filter="url(#cien)">
    <rect x="27" y="15" width="28" height="38" rx="5" fill="#ffffff"/>
    <path d="M33.5 30 L34.5 22.5 L39.5 26.5 Z M48.5 30 L47.5 22.5 L42.5 26.5 Z" fill="#fb923c"/>
    <path d="M35.2 27.5 L35.8 24.6 L38 26.4 Z M46.8 27.5 L46.2 24.6 L44 26.4 Z" fill="#fbcfe8"/>
    <circle cx="41" cy="34" r="8.5" fill="#fb923c"/>
    <ellipse cx="41" cy="37.5" rx="4.8" ry="3.6" fill="#ffffff"/>
    <circle cx="37.8" cy="32.8" r="1.3" fill="#1c1f2b"/>
    <circle cx="44.2" cy="32.8" r="1.3" fill="#1c1f2b"/>
    <path d="M40 36 L42 36 L41 37.2 Z" fill="#ec4899"/>
  </g>
</svg>
